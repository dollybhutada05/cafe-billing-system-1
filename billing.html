<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Brew Cafe – Billing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="billing.css" />
</head>
<body>

<div class="pos-app-container">
  <div class="ambient-glow-mesh ambient-amber" aria-hidden="true"></div>
  <div class="ambient-glow-mesh ambient-indigo" aria-hidden="true"></div>

  <header class="pos-header">
    <div class="pos-brand">
      <div class="terminal-badge">
        <span class="pulse-indicator" id="pulse-indicator"></span>
        <span>TERMINAL #04 &bull; URBAN BREW</span>
      </div>
      <h1 class="pos-title">Cafe Billing</h1>
    </div>
    <div class="header-status-pill">
      <span id="header-status">Status: Ready</span>
    </div>
  </header>

  <main class="pos-workspace">
    <div class="menu-section">
      <h2 class="category-title">Coffee & Drinks</h2>
      <div class="menu-grid" id="drinks-grid"></div>
      <h2 class="category-title">Snacks & Food</h2>
      <div class="menu-grid" id="food-grid"></div>
    </div>

    <div class="billing-section">
      <h2>Current Order</h2>
      <div class="cart-list" id="cart-items">
        <p class="empty-cart-msg">No items added yet.</p>
      </div>
      <div class="summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₹0.00</span>
        </div>
        <div class="summary-row">
          <span>GST (5%)</span>
          <span id="tax">₹0.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="total">₹0.00</span>
        </div>
        <button class="btn-checkout" id="print-receipt-btn">🖨️ Print Receipt</button>
      </div>
    </div>
  </main>
</div>

<script src="billing.js"></script>
</body>
</html>
